<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
        }

        .image-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            animation: toggle 1s infinite step-end;
        }

        .image-container img:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes toggle {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <audio id="bgm" src="youareanidiot/youareanidiot.wav" loop></audio>

    <div class="image-container">
        <img src="youareanidiot/image_1.png" alt="image_1">
        <img src="youareanidiot/image_2.png" alt="image_2">
    </div>

    <script>
        document.body.addEventListener('click', function() {
            const audio = document.getElementById('bgm');
            audio.play();
        }, { once: true });
    </script>

</body>

</html>
